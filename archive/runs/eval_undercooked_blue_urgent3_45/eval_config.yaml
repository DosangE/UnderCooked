# UnderCooked - 6-dish diagnosis, 45 s rounds / goal 3 (the original final difficulty).
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# Inference only (600k steps). Same environment as undercooked_blue_final.yaml.
# Used for eval_undercooked_blue_fix9, _red_mix and _urgent_45. Attach
# archive/tools/inference/pot_fill_log.cs after Play starts, then summarize with
# archive/tools/analyze_pot_fills.py. Inference never stops on its own: stop Play
# at Step 600000 and kill the trainer process tree (taskkill /T).
#
# Run:
#   mlagents-learn configs/undercooked_blue_eval45.yaml --run-id=eval_<run> --initialize-from=<run> --inference --seed=1 --torch-device cuda

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    # The old final model took 3 x 3M at final difficulty (73% -> 90% -> 98%).
    # Here it is one 9M run.
    max_steps: 600000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  # Final difficulty with all 6 recipes (= last row of the stage table).
  target_dishes: 3.0
  recipe_pool_size: 6.0
  needs_prep: 1.0
  cook_time: 5.0
  order_slots: 3.0
  order_duration: 25.0
  max_ingredients: 2.0
  # wrong_ingredient_penalty is NOT set: the code default (-0.3) is used,
  # the same as undercooked_blue_s1.
