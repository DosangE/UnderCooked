default_settings: null
behaviors:
  Chef:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 128
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: results\undercooked_stage_s2_ft\Chef\checkpoint.pt
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 600000
    time_horizon: 128
    summary_freq: 20000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: 1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  target_dishes:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 1
          value: 3.0
      name: target_dishes
      completion_criteria: null
  recipe_pool_size:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 2
          value: 3.0
      name: recipe_pool_size
      completion_criteria: null
  needs_prep:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 3
          value: 1.0
      name: needs_prep
      completion_criteria: null
  cook_time:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4
          value: 5.0
      name: cook_time
      completion_criteria: null
  order_slots:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5
          value: 3.0
      name: order_slots
      completion_criteria: null
  order_duration:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6
          value: 25.0
      name: order_duration
      completion_criteria: null
  max_ingredients:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7
          value: 2.0
      name: max_ingredients
      completion_criteria: null
  wrong_ingredient_penalty:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 8
          value: -0.3
      name: wrong_ingredient_penalty
      completion_criteria: null
checkpoint_settings:
  run_id: eval_stage_s2_ft
  initialize_from: undercooked_stage_s2_ft
  load_model: false
  resume: false
  force: false
  train_model: false
  inference: true
  results_dir: results
torch_settings:
  device: cuda
debug: false
