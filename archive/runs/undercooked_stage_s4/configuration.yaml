default_settings: null
behaviors:
  Chef:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 128
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 20000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: 4
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  stage_curriculum:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4
          value: 1.0
      name: stage_curriculum
      completion_criteria: null
  stage_success_threshold:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5
          value: 0.8
      name: stage_success_threshold
      completion_criteria: null
  stage_window:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6
          value: 500
      name: stage_window
      completion_criteria: null
  stage_max_episodes:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 7
          value: 6000
      name: stage_max_episodes
      completion_criteria: null
  stage_start:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 8
          value: 0
      name: stage_start
      completion_criteria: null
  order_duration:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 9
          value: 25.0
      name: order_duration
      completion_criteria: null
  max_ingredients:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 10
          value: 2.0
      name: max_ingredients
      completion_criteria: null
checkpoint_settings:
  run_id: undercooked_stage_s4
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: cuda
debug: false
