# UnderCooked - blue fix, continue at the final stage (6 dishes).
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# Step E of the overnight plan (results/overnight/PLAN.md). undercooked_blue_fix
# reached stage 9 by a forced advance at 10.52M and was still rising there
# (21.8% -> 26.1% over 1.5M). This continues it at stage 9 only.
#
# Run:
#   mlagents-learn configs/undercooked_blue_fix9.yaml --run-id=undercooked_blue_fix9 --initialize-from=undercooked_blue_fix --seed=1 --torch-device cuda
#
# Everything under behaviors is identical to undercooked_blue_fix.yaml except max_steps.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    # Sized to stop before 09:10 (about 14 min per 1M steps).
    max_steps: 14000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  # 1 = use the stage table. target_dishes / recipe_pool_size / needs_prep /
  # cook_time / order_slots are then ignored, so they are not set here.
  stage_curriculum: 1.0
  # Advance when the last stage_window episodes of the current stage (all 16
  # kitchens together) reach this success rate. One episode is ~300-900 steps,
  # so 500 episodes is roughly 0.15-0.45M steps.
  stage_success_threshold: 0.8
  stage_window: 500
  # Safety cap so an unattended run cannot sit on one stage forever
  # (roughly 2-5M steps). A forced advance is logged with a star in the
  # Unity console; report it if it happens.
  stage_max_episodes: 6000
  stage_start: 9

  order_duration: 25.0
  max_ingredients: 2.0
  # wrong_ingredient_penalty is NOT set: the code default (-0.3) is used,
  # because this run is meant to test the current code as-is.
