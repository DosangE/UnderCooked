# UnderCooked - blue ingredient, 6 dishes, 90 s / 8 dishes, stronger expiry signal.
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# undercooked_blue_long8 (stopped at ~5M) made rounds long enough that skipped
# orders expire inside the round (~2.8 expiries per round, about 1.8 of them RedSoup),
# yet RedSoup stayed at 5-6% of dishes. Likely reason: the penalty lands ~10-30 s
# (100-300 decisions) after the choice of what to cook, and gamma 0.99 discounts it
# to 0.37-0.05 at that point, so -1.0 is almost invisible.
# Changes (yaml only): expiry penalty -1.0 -> -3.0, gamma 0.99 -> 0.995
# (horizon ~200 decisions = 20 s).
#
# Run:
#   mlagents-learn configs/undercooked_blue_long8_g995.yaml --run-id=undercooked_blue_long8_g995 --initialize-from=undercooked_blue_long8 --seed=1 --torch-device cuda
#
# Everything else is identical to undercooked_blue_long8.yaml.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 9000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  target_dishes: 8.0
  recipe_pool_size: 6.0
  needs_prep: 1.0
  cook_time: 5.0
  order_slots: 3.0
  order_duration: 30.0
  max_ingredients: 2.0
  episode_duration: 90.0
  order_expired_penalty: -3.0
