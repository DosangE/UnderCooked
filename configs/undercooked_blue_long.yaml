# UnderCooked - blue ingredient, 6 dishes, longer rounds so every order can be served.
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# undercooked_blue_red_mix reached 99.4% goal but still skips RedSoup: when RedSoup
# is on the board it picks it 6.5% of the time (116 / 1774, diag_undercooked_blue_red_mix).
# Cause: one dish takes ~15 s, while 3 slots x 25 s orders ask for one every ~8 s.
# Some orders MUST expire every round, every dish pays the same (+3 serve, -0.5 expiry),
# so choosing RedSoup as the one to drop is free.
#
# Here the order time (45 s) matches the serve rate (3 slots x 15 s), so all orders
# can be served and dropping one is a real loss. The round is 90 s so expiries happen
# inside the round, and the goal is 5 dishes so 90 s is not trivially easy.
# episode_duration and order_expired_penalty are read by KitchenEnv.ResetEnv
# (the scene default stays 45 s; StartupValidator still checks that).
#
# Run:
#   mlagents-learn configs/undercooked_blue_long.yaml --run-id=undercooked_blue_long --initialize-from=undercooked_blue_red_mix --seed=1 --torch-device cuda
#
# Everything under behaviors is identical to undercooked_blue_red_mix.yaml.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 9000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  target_dishes: 5.0
  recipe_pool_size: 6.0
  needs_prep: 1.0
  cook_time: 5.0
  order_slots: 3.0
  order_duration: 45.0
  max_ingredients: 2.0
  episode_duration: 90.0
  order_expired_penalty: -1.0
