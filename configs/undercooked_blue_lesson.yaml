# UnderCooked - blue lesson: the easiest task that needs the blue box
# (fallback C of the overnight plan).
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# Only BlueSoup is ordered, one order at a time, one dish wins, cook 2s.
# Prep stays on (the policy has always prepped since stage 4). beta 0.03.
# Used only if undercooked_blue_fix and undercooked_blue_fix_b03 both never
# cooked a BlueSoup in their first 2M steps.
#
# Run:
#   mlagents-learn configs/undercooked_blue_lesson.yaml --run-id=undercooked_blue_lesson --initialize-from=undercooked_blue_final --seed=1 --torch-device cuda

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.03
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  target_dishes: 1.0
  recipe_pool_start: 3.0
  recipe_pool_size: 4.0
  needs_prep: 1.0
  cook_time: 2.0
  order_slots: 1.0
  order_duration: 25.0
  max_ingredients: 2.0
