# UnderCooked - blue ingredient (6 dishes), one run from scratch with the
# success-gated stage table.
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# What changed from undercooked_stage.yaml (2026-10-03, dev_add-blue):
#   - a third ingredient (blue) and 3 new recipes: BlueSoup (blue x2),
#     GreenBlueSoup, RedBlueSoup. Every recipe is still exactly 2 ingredients.
#   - observation 103 -> 145 (one-hot sizes grew; the encoding is the same).
#     So the old models cannot be loaded; this run starts from random init.
#   - stage table in StageCurriculum.cs:
#       0: 1 dish,  1 recipe, no prep,  cook 2s, 1 slot   (= old lesson0)
#       1: 3 dishes
#       2: 2 recipes
#       3: prep on in 50% of episodes
#       4: prep always on
#       5: 3 recipes, cook 5s, 2 slots   (old stage 5 = 3 recipes with 1 slot
#                                         was removed: both successful runs
#                                         were force-advanced there)
#       6: 3 slots                       (= old final difficulty)
#       7: orders BlueSoup only          (blue appears; nothing else sells)
#       8: orders recipes 2-5 (RedSoup, BlueSoup, GreenBlueSoup, RedBlueSoup)
#       9: all 6 recipes                 (= new final difficulty)
#     Stages 7-8 leave out GreenSoup/MixSoup on purpose. The first version
#     (7: first 4 recipes, 8: all 6) was passed by making only those two
#     dishes; blue was never used (results/diag_blue). See StageCurriculum.cs.
#
# Note: undercooked_stage.yaml now also runs this new table.
#
# Run (seeds one after another; stop a seed that has 0% success at 4.5M, the
# same rule as the earlier stage runs):
#   mlagents-learn configs/undercooked_blue_stage.yaml --run-id=undercooked_blue_s1 --seed=1 --torch-device cuda
#
# Watch Kitchen/Stage and Kitchen/StageSuccessRate in TensorBoard, and the
# "[StageCurriculum] ..." lines in the Unity console.
#
# Resuming: Unity restarts at stage_start, not where the run stopped. Before
# --resume, set stage_start to the last Kitchen/Stage value.
#
# Everything under behaviors is identical to undercooked_stage.yaml except max_steps.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    # 20M (undercooked_stage.yaml) + 5M for the two blue stages. The removed
    # old stage 5 cost ~5M in both successful runs, so the old part should
    # finish earlier than before.
    max_steps: 25000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  # 1 = use the stage table. target_dishes / recipe_pool_size / needs_prep /
  # cook_time / order_slots are then ignored, so they are not set here.
  stage_curriculum: 1.0
  # Advance when the last stage_window episodes of the current stage (all 16
  # kitchens together) reach this success rate. One episode is ~300-900 steps,
  # so 500 episodes is roughly 0.15-0.45M steps.
  stage_success_threshold: 0.8
  stage_window: 500
  # Safety cap so an unattended run cannot sit on one stage forever
  # (roughly 2-5M steps). A forced advance is logged with a star in the
  # Unity console; report it if it happens.
  stage_max_episodes: 6000
  stage_start: 0

  order_duration: 25.0
  max_ingredients: 2.0
  # wrong_ingredient_penalty is NOT set: the code default (-0.3) is used,
  # because this run is meant to test the current code as-is.
