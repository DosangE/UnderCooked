# UnderCooked - MA-POCA, 2 cooperating chefs.
#
# ASCII ONLY. Do not put non-ASCII characters (Korean comments included) in this file.
# mlagents' load_config() opens it with the OS default codepage (cp949 on this machine),
# not UTF-8, so any non-ASCII byte aborts training before it starts.
# Design rationale lives in ../README.md instead.
#
# Run:
#   mlagents-learn configs/undercooked.yaml --run-id=undercooked_v1
#   (press Play in the Unity editor once it says "Listening on port 5004")
#
# The 'Chef' key must match Behavior Parameters > Behavior Name exactly.
# environment_parameters keys must match the names KitchenEnv.ResetEnv() reads:
#   target_dishes  cook_time  max_ingredients  needs_prep
#   order_slots    recipe_pool_size            order_duration

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 8000000
    time_horizon: 128         # episode is 45s = ~450 decisions (KitchenEnv.episodeDuration)
    summary_freq: 20000

environment_parameters:
  # ---------------------------------------------------------------
  # Only target_dishes is gated on reward. Everything else is gated on
  # training progress.
  #
  # Reason: a reward threshold is only meaningful if the task behind it is
  # holding still. If several reward-gated curricula advance at once, each
  # one changes the reward scale the others are measured against, and the
  # lessons either all fire together or deadlock. So exactly one reward
  # curriculum, and the difficulty knobs move on a fixed schedule.
  # ---------------------------------------------------------------

  # Dishes required to finish an episode: 1 -> 2 -> 3.
  # Approx. cumulative reward per agent on a successful episode:
  #   lesson0 (1 dish): ~6.0   lesson1 (2): ~9.4   lesson2 (3): ~13.0
  # Thresholds sit around "succeeds about half the time".
  target_dishes:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: reward
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 1.0
      - name: lesson1
        completion_criteria:
          measure: reward
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 6.0
        value: 2.0
      - name: lesson2
        value: 3.0

  # How many distinct recipes can be ordered, taken from the front of the
  # RecipeType enum: 1 = GreenSoup only, 2 = + MixSoup, 3 = + RedSoup.
  #
  # This is THE order-reading curriculum. At 1 there is nothing to read and the
  # agents just learn the pipeline. At 2 the red box becomes relevant and the
  # policy has to condition on the ticket. At 3 both "2 of one colour" recipes
  # exist, so the counter-handoff pattern changes per order.
  recipe_pool_size:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.15
        value: 1.0
      - name: lesson1
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.30
        value: 2.0
      - name: lesson2
        value: 3.0

  # Chopping: off -> on. Off first so the shorter chain (box -> pot -> plate ->
  # hatch) is learned before the prep stations are inserted into it.
  needs_prep:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.20
        value: 0.0
      - name: lesson1
        value: 1.0

  # Cook time: 2s -> 5s.
  # Short at first so the "pot full -> dish" causal link is easy to pick up,
  # then raised to the real difficulty. A longer cook time means a longer
  # interval to remember, which is what makes the RNN earn its place.
  cook_time:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.35
        value: 2.0
      - name: lesson1
        value: 5.0

  # Pending orders at once: 1 -> 2 -> 3.
  # At 1 the task is pure execution. From 2 on there is a real choice - which
  # ticket to fill first, and whether a ticket is already too far gone to save.
  # Introduced last because it is only a planning problem once the pipeline
  # itself is reliable.
  order_slots:
    curriculum:
      - name: lesson0
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.50
        value: 1.0
      - name: lesson1
        completion_criteria:
          measure: progress
          behavior: Chef
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.65
        value: 2.0
      - name: lesson2
        value: 3.0

  # Seconds before an unfilled order expires. Episode is 45s.
  order_duration: 25.0

  # Ingredients allowed outside the pot at once (hands + counters).
  max_ingredients: 2.0
