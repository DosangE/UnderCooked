# UnderCooked - 6-dish diagnosis, 90 s rounds / goal 8 (the urgent runs' training conditions).
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# Inference only (600k steps). Same environment as undercooked_blue_urgent.yaml.
# Used for eval_undercooked_blue_urgent_90. See undercooked_blue_eval45.yaml for the procedure.
#
# Run:
#   mlagents-learn configs/undercooked_blue_eval90.yaml --run-id=eval_<run>_90 --initialize-from=<run> --inference --seed=1 --torch-device cuda

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 600000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  target_dishes: 8.0
  recipe_pool_size: 6.0
  needs_prep: 1.0
  cook_time: 5.0
  order_slots: 3.0
  order_duration: 30.0
  max_ingredients: 2.0
  episode_duration: 90.0
  order_expired_penalty: -3.0
  urgent_serve_bonus: 1.5
