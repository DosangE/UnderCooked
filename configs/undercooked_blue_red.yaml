# UnderCooked - blue ingredient, RedSoup only (teach red x2).
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# The 6-dish model (undercooked_blue_fix9, 92.4%) almost never cooks RedSoup
# (25 made of 1708 ordered, archive/runs/eval_undercooked_blue_fix9). It covers
# the other 5 dishes instead. Same fix as for blue: order only the missing dish,
# then mix all 6 again (undercooked_blue_red_mix.yaml).
#
# Only RedSoup is ordered (recipe_pool_start 2, recipe_pool_size 3). MixSoup is
# NOT included: with 3 order slots a MixSoup would be on the board in ~87% of
# moments and the policy could keep using its shortcut.
# The green and blue boxes are closed in this run (no order needs them).
#
# Run:
#   mlagents-learn configs/undercooked_blue_red.yaml --run-id=undercooked_blue_red --initialize-from=undercooked_blue_fix9 --seed=1 --torch-device cuda
#
# Everything under behaviors is identical to undercooked_blue_stage.yaml except max_steps.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 20000

environment_parameters:
  target_dishes: 3.0
  recipe_pool_start: 2.0
  recipe_pool_size: 3.0
  needs_prep: 1.0
  cook_time: 5.0
  order_slots: 3.0
  order_duration: 25.0
  max_ingredients: 2.0
