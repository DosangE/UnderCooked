# UnderCooked - final-difficulty fine-tune (no curriculum).
#
# ASCII ONLY (see undercooked.yaml header - load_config() uses the OS codepage).
#
# Purpose: continue from the undercooked_v2 policy (54% goal rate at final
# difficulty after 8M steps) with every knob fixed at its final value.
# v2's last 1M steps barely moved (48% -> 54%) while the linear learning-rate
# schedule was running out; this run restarts the schedule from 3e-4.
# There are no curriculum transitions here, so the prep-transition collapse
# seen in v2 (reports/2026-09-25-undercooked_v1-serve-zero.md section 8)
# cannot happen in this run.
#
# Run:
#   mlagents-learn configs/undercooked_final.yaml --run-id=undercooked_final --initialize-from=undercooked_v2 --torch-device cuda
#
# Everything under behaviors is identical to undercooked.yaml except max_steps.

behaviors:
  Chef:
    trainer_type: poca

    hyperparameters:
      batch_size: 1024        # multiple of sequence_length (64)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 20000

# All knobs fixed at the final lesson values of undercooked.yaml.
environment_parameters:
  target_dishes: 3.0
  recipe_pool_size: 3.0
  needs_prep: 1.0
  cook_time: 5.0
  order_slots: 3.0
  order_duration: 25.0
  max_ingredients: 2.0
